ALGORITHM: PPO
SINGLE_AGENT: True

ENV_CONFIG:
    env_name: k_out_of_n_infinite
    env_setting: hard-1-of-4_infinite
    kwargs:
        time_limit: 50
    inference_env_kwargs:
        time_limit: 20

SEED: 42
DETERMINISTIC: True # deterministic operations are often slower than nondeterministic operations, but ensure reproducibility.
total_timesteps: 10_000_000

# PPO hyperparameters
learning_rate: 2.5e-4
num_envs: 4
num_steps: 128
anneal_lr: False
gamma: 0.8
gae_lambda: 0.95
num_minibatches: 4
update_epochs: 4
norm_adv: True
clip_coef: 0.2
clip_vloss: True
ent_coef: 0.01
max_grad_norm: 0.5
target_kl: null

LOGGING_INTERVAL: 100 # iterations; if null, log every iteration; else log when (iteration % LOGGING_INTERVAL == 0)
EVAL_INTERVAL_TIMESTEPS: 1_000_000 # timesteps; converted internally to iterations
NUM_INFERENCE_EPISODES: 10_000 # episodes
CHECKPOINT_INTERVAL_TIMESTEPS: 1_000_000 # timesteps; converted internally to iterations
CHECKPOINT_DIR: ./checkpoints/

WANDB:
    project: null
    entity: null
    dir: null
    mode: online
